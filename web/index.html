<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `$FLUTTER_BASE_HREF` is replaced by the `--base-href` argument of `flutter build`.
    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>R M Naresh Kumar — Software Development Engineer</title>
  <meta name="description" content="Software Development Engineer building cross-platform Flutter and native Android (Kotlin, Jetpack Compose) apps. Experience, projects, skills, and contact.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://naresh-portfolio-sde.web.app/">

  <!-- Link previews (LinkedIn, Slack, X, WhatsApp) read these; they don't run the app. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://naresh-portfolio-sde.web.app/">
  <meta property="og:title" content="R M Naresh Kumar — Software Development Engineer">
  <meta property="og:description" content="Flutter and native Android engineer: fintech security, offline-first apps, real-time dashboards, and release automation.">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Naresh Kumar">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; background: #000; }
    /* Shown while CanvasKit + main.dart.js download; removed on Flutter's first frame. */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #000; transition: opacity 250ms ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .wordmark { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: 3px; }
    #loader .wordmark span { color: #FF6B00; }
    #loader .bar { width: 140px; height: 3px; border-radius: 3px; background: #222; overflow: hidden; }
    #loader .bar div {
      width: 40%; height: 100%; border-radius: 3px; background: #FF6B00;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loader .bar div { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading portfolio">
    <div class="wordmark"><span>N</span>ARESH</div>
    <div class="bar"><div></div></div>
  </div>
  <noscript>
    <p style="color:#fff;font-family:system-ui,sans-serif;text-align:center;margin-top:40vh">
      This portfolio needs JavaScript. You can still <a href="resume.pdf" style="color:#FF6B00">download the resume</a>.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
